name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly what the
        # lockfile pins and FAILS when package.json and package-lock.json
        # disagree, instead of quietly resolving a different tree than the one
        # anyone tested. The comment this replaces said the lockfile lagged the
        # manifest and that `npm install` was the workaround; that is no longer
        # true — `npm ci` completes cleanly in 37s against the committed
        # lockfile, and every other workflow in this repository already prefers
        # it.
        #
        # Note the repo also carries `bun.lock` and `bun.lockb`. No workflow
        # uses them and `bun.lockb` predates the support-ticketing dependencies
        # by three weeks, so anyone running `bun install` gets a tree that is
        # missing packages the app now imports. Left in place because the
        # generating platform's own toolchain was not verified from here.
        run: npm ci --no-audit --no-fund

      # Runs before the typecheck it protects: a table missing from the
      # generated types makes every query against it resolve to `never`, so the
      # typecheck goes green precisely because nothing is being checked.
      - name: Supabase types match migrations
        run: npm run check:supabase-types

      # The typecheck is only as good as the files it is allowed to see.
      - name: '@ts-nocheck budget'
        run: npm run check:ts-nocheck

      # A table with RLS on and no policy is closed, and closed reads answer
      # with an empty array rather than an error — so nothing at runtime says so.
      - name: RLS policy coverage
        run: npm run check:rls

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
